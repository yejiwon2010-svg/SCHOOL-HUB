<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1a30">
<title>School Life Hub</title>
<!-- 글꼴: 인터넷이 연결되어 있으면 예쁜 글꼴, 아니면 기본 글꼴로 자동 대체돼요 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
<style>
  :root {
    --navy: #0f1a30; --navy-2: #1b2a4a;
    --gold: #b8975a; --gold-2: #d6bd8a; --gold-soft: #f1e9d6;
    --bg: #f6f3ec; --card: #ffffff; --line: #e9e3d4;
    --ink: #1a2236; --muted: #7a7f8e;
    --red: #8c2f36; --red-bg: #f6e3e4;
    --green: #2f5a46; --green-bg: #e4eee8;
    --amber: #7a5f26; --amber-bg: #f3ead6;
    --blue: #2c4a7a; --blue-bg: #e4ecf6;
    --sans: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --serif: "Playfair Display", "Noto Serif KR", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; }
  .hidden { display: none !important; }

  /* ================= 로그인 / 회원가입 ================= */
  .auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
  .auth-hero {
    color: #fff; padding: 64px 60px; display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(circle at 0% 0%, rgba(184,151,90,.22), transparent 55%), radial-gradient(circle at 100% 100%, rgba(184,151,90,.12), transparent 50%), linear-gradient(160deg, var(--navy-2), #0a1224);
  }
  .auth-hero .mark { width: 46px; height: 46px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 22px; color: var(--gold-2); }
  .auth-hero h1 { font-family: var(--serif); font-size: 46px; line-height: 1.15; margin: 22px 0 12px; font-weight: 500; }
  .auth-hero h1 em { color: var(--gold-2); }
  .auth-hero .tag { color: #b9c1d8; font-size: 16px; max-width: 420px; }
  .feat { display: flex; gap: 14px; margin-top: 24px; max-width: 440px; }
  .feat .ic { width: 42px; height: 42px; flex: none; border: 1px solid rgba(214,189,138,.45); border-radius: 12px; display: grid; place-items: center; color: var(--gold-2); }
  .feat .ic svg, nav button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .feat b { display: block; font-weight: 600; }
  .feat span { color: #9fa9c4; font-size: 13.5px; }
  .auth-form-wrap { display: grid; place-items: center; padding: 40px 24px; }
  .auth-card { width: min(420px, 100%); padding: 30px 28px; }
  .auth-card h2 { font-family: var(--serif); font-size: 26px; font-weight: 500; margin: 0 0 4px; }
  .form-msg { min-height: 20px; font-size: 13.5px; color: var(--red); margin: 8px 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .acc-chips { margin-bottom: 14px; }
  .note { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-top: 14px; padding: 12px 14px; background: #faf8f3; border-radius: 10px; }

  /* ================= 앱 레이아웃 ================= */
  .app { display: flex; min-height: 100vh; }
  .side {
    width: 244px; flex: none; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 30px 18px 20px; color: #fff;
    background: radial-gradient(circle at 0% 0%, rgba(184,151,90,.16), transparent 55%), linear-gradient(180deg, var(--navy), #0a1224);
  }
  .brand { padding: 0 10px 24px; border-bottom: 1px solid rgba(255,255,255,.09); margin-bottom: 18px; }
  .brand .mark { width: 38px; height: 38px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 18px; color: var(--gold-2); margin-bottom: 14px; }
  .brand .name { font-family: var(--serif); font-size: 21px; letter-spacing: .5px; line-height: 1.2; }
  .brand .name span { color: var(--gold-2); font-style: italic; }
  .brand .sub { font-size: 11px; letter-spacing: 2.5px; color: #8e98b3; margin-top: 6px; }
  nav { display: flex; flex-direction: column; gap: 3px; }
  nav button { display: flex; align-items: center; gap: 13px; padding: 11px 14px; font-size: 14.5px; color: #aab3cb; background: transparent; border: none; border-radius: 10px; cursor: pointer; text-align: left; position: relative; transition: background .2s, color .2s; }
  nav button:hover { background: rgba(255,255,255,.05); color: #fff; }
  nav button.on { background: rgba(255,255,255,.08); color: var(--gold-2); font-weight: 600; }
  nav button.on::before { content: ""; position: absolute; left: -18px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--gold); }
  .m-only { display: none !important; }
  .userbox { margin-top: auto; display: flex; align-items: center; gap: 11px; padding: 12px 10px 0; border-top: 1px solid rgba(255,255,255,.09); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--navy); display: grid; place-items: center; font-weight: 700; flex: none; }
  .userbox .nm { font-size: 14px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .userbox .lo { font-size: 12px; color: #8e98b3; background: none; border: none; padding: 0; cursor: pointer; }
  .userbox .lo:hover { color: var(--gold-2); }
  .content { flex: 1; min-width: 0; padding: 38px 44px 60px; max-width: 1000px; }
  .content.enter { animation: enter .35s ease; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  .page-title { font-family: var(--serif); font-size: 30px; font-weight: 500; margin: 0 0 4px; letter-spacing: -.2px; }
  .page-lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

  /* ================= 공통 요소 ================= */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(15,26,48,.03), 0 10px 30px -14px rgba(15,26,48,.12); }
  .card + .card { margin-top: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 10px; }
  .card-head h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 2px; color: var(--gold); text-transform: uppercase; }
  .linkbtn { font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; }
  .linkbtn:hover { color: var(--navy); }
  input, select, textarea { width: 100%; padding: 11px 13px; font-size: 14.5px; color: var(--ink); background: #faf8f3; border: 1px solid var(--line); border-radius: 10px; transition: border-color .2s, box-shadow .2s, background .2s; }
  textarea { resize: vertical; line-height: 1.65; }
  input:focus, select:focus, textarea:focus { outline: none; background: #fff; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(184,151,90,.15); }
  input::placeholder, textarea::placeholder { color: #aaa9a0; }
  .btn { padding: 11px 22px; font-size: 14.5px; font-weight: 600; color: #fff; background: var(--navy); border: 1px solid var(--navy); border-radius: 10px; cursor: pointer; transition: all .2s; }
  .btn:hover { background: var(--navy-2); }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: var(--navy); }
  .btn.gold:hover { background: var(--gold-2); border-color: var(--gold-2); }
  .btn.ghost { background: transparent; color: var(--navy); border-color: var(--line); }
  .btn.ghost:hover { background: var(--gold-soft); border-color: var(--gold); }
  .btn.danger { background: transparent; color: var(--red); border-color: #e7c4c6; }
  .btn.danger:hover { background: var(--red-bg); }
  .btn.sm { padding: 7px 14px; font-size: 13px; }
  .btn.full { width: 100%; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--green-bg); color: var(--green); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.gray { background: #eceae4; color: #8a8a84; }
  .chip { display: inline-block; padding: 4px 11px; border-radius: 999px; background: var(--gold-soft); color: var(--amber); font-size: 12.5px; margin: 0 6px 6px 0; border: none; }
  button.chip { cursor: pointer; }
  button.chip:hover, .chip.on { background: var(--navy); color: #fff; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; line-height: 1.7; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .small { font-size: 12.5px; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .seg { display: inline-flex; padding: 4px; gap: 2px; background: #ece7da; border-radius: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg button { padding: 8px 18px; font-size: 13.5px; color: var(--muted); background: transparent; border: none; border-radius: 9px; cursor: pointer; transition: all .2s; }
  .seg button.on { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 4px rgba(15,26,48,.1); }
  .x { background: none; border: none; color: #c3c0b6; font-size: 15px; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  .x:hover { color: var(--red); background: var(--red-bg); }
  .two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; }
  .two > .card + .card { margin-top: 0; }
  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0; background: var(--navy); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 14px; border: 1px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: all .3s; z-index: 99; pointer-events: none; max-width: 92vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ================= 홈 ================= */
  .hero { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px; padding: 30px 34px; margin-bottom: 18px; color: #fff; border-radius: 22px; background: radial-gradient(circle at 92% 0%, rgba(184,151,90,.28), transparent 50%), linear-gradient(135deg, var(--navy-2), var(--navy)); box-shadow: 0 18px 40px -20px rgba(15,26,48,.55); position: relative; overflow: hidden; }
  .hero::after, .result::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(214,189,138,.22); border-radius: 15px; pointer-events: none; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; color: var(--gold-2); margin-bottom: 8px; }
  .hero-date { font-family: var(--serif); font-size: 44px; line-height: 1.1; font-weight: 500; }
  .hero-sub { color: #b9c1d8; margin-top: 8px; font-size: 14.5px; }
  .hero-stats { display: flex; gap: 10px; position: relative; z-index: 1; flex-wrap: wrap; }
  .hs { min-width: 104px; padding: 14px 18px; text-align: left; color: #fff; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; cursor: pointer; transition: all .2s; }
  .hs:hover { background: rgba(255,255,255,.11); border-color: rgba(214,189,138,.5); transform: translateY(-2px); }
  .hs-n { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.15; color: var(--gold-2); font-variant-numeric: tabular-nums; }
  .hs-l { display: block; font-size: 12px; color: #aab3cb; margin-top: 3px; }
  .li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: none; padding-bottom: 2px; }
  .li:first-child { padding-top: 2px; }
  .li .l { min-width: 0; }
  .li .l b { font-weight: 600; }
  .li .l small { display: block; color: var(--muted); font-size: 12.5px; }
  .per { display: grid; grid-template-columns: 46px 1fr; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .per:last-child { border-bottom: none; }
  .per i { font-style: normal; font-family: var(--serif); color: var(--gold); font-size: 15px; }
  .bring { margin-top: 12px; padding: 11px 14px; background: var(--gold-soft); border-radius: 10px; font-size: 13.5px; color: var(--amber); }
  .spark { margin-top: 18px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border-left: 4px solid var(--gold); }
  .spark .q { font-family: var(--serif); font-size: 17px; line-height: 1.6; flex: 1; min-width: 220px; }

  /* ================= 수행평가 ================= */
  .add-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .wide { grid-column: 1 / -1; }
  .task { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-bottom: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; transition: box-shadow .2s, transform .2s; }
  .task:hover { box-shadow: 0 8px 22px -12px rgba(15,26,48,.2); transform: translateY(-1px); }
  .task.done .t-title { text-decoration: line-through; color: var(--muted); }
  .task.done { background: #fbfaf6; }
  .t-info { flex: 1; min-width: 0; cursor: pointer; }
  .t-title { font-weight: 600; word-break: break-all; }
  .t-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .t-badges { margin-top: 6px; }
  .t-badges .chip { font-size: 11.5px; padding: 2px 9px; margin-bottom: 0; }
  .chk { position: relative; width: 24px; height: 24px; flex: none; cursor: pointer; }
  .chk input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
  .chk span { pointer-events: none; position: absolute; inset: 0; border: 1.6px solid var(--gold); border-radius: 50%; transition: all .2s; }
  .chk input:checked + span { background: var(--navy); border-color: var(--navy); }
  .chk span::after { content: ""; position: absolute; left: 7px; top: 3.5px; width: 6px; height: 11px; border: solid var(--gold-2); border-width: 0 2px 2px 0; transform: rotate(45deg) scale(0); transition: transform .2s; }
  .chk input:checked + span::after { transform: rotate(45deg) scale(1); }

  /* ----- 수행평가 상세 ----- */
  .back { margin-bottom: 14px; }
  .d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sec-h .no { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: var(--gold-2); display: grid; place-items: center; font-family: var(--serif); font-size: 14px; flex: none; }
  .sec-h h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .drop { border: 1.5px dashed #d9cfae; border-radius: 14px; padding: 12px; background: #fcfaf4; margin-top: 12px; transition: background .2s; }
  .drop.over { background: var(--gold-soft); border-color: var(--gold); }
  .drop textarea { background: #fff; }
  .fileinfo { font-size: 12.5px; color: var(--green); margin-top: 8px; }
  .info-chips { margin-top: 12px; }
  .crit { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .crit:last-child { border-bottom: none; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 6px; background: var(--amber-bg); color: var(--amber); text-align: center; white-space: nowrap; }
  .badge.len { background: var(--blue-bg); color: var(--blue); }
  .badge.kw { background: var(--green-bg); color: var(--green); }
  .badge.no { background: var(--red-bg); color: var(--red); }
  .crit-body .rw { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .crit-body input, .crit-body select { padding: 8px 10px; font-size: 14px; width: auto; }
  .crit-body input.num { width: 90px; }
  .crit-body input.txt { flex: 1; min-width: 200px; }
  .src { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: keep-all; }
  .add-crit { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .add-crit select { width: auto; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .stat-chip { padding: 9px 15px; background: var(--gold-soft); border-radius: 12px; font-size: 12.5px; color: var(--amber); }
  .stat-chip b { display: block; font-family: var(--serif); font-size: 20px; color: var(--navy); font-weight: 500; }
  .verdict { padding: 16px 18px; border-radius: 14px; margin-bottom: 14px; font-weight: 600; line-height: 1.5; }
  .verdict.good { background: var(--green-bg); color: var(--green); }
  .verdict.warn { background: var(--amber-bg); color: var(--amber); }
  .verdict.bad { background: var(--red-bg); color: var(--red); }
  .res { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 12px; margin-bottom: 8px; background: #fbfaf6; border: 1px solid var(--line); }
  .res .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; margin-top: 1px; }
  .res.ok .mk { background: var(--green-bg); color: var(--green); }
  .res.bad { border-color: #e7c4c6; background: #fdf6f6; }
  .res.bad .mk { background: var(--red-bg); color: var(--red); }
  .res.todo .mk { background: var(--amber-bg); color: var(--amber); }
  .res .tx { flex: 1; min-width: 0; }
  .res .tx b { font-weight: 600; }
  .res .tx small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .res label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .res label input { width: 18px; height: 18px; margin-top: 3px; flex: none; accent-color: var(--navy); }
  .disclaimer { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.7; }

  /* ================= 활동 기록 / 심화탐구 ================= */
  .rf { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .rec { margin-bottom: 12px; }
  .rec h3 { margin: 0 0 4px; font-size: 17px; }
  .rec .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .rec dl { margin: 10px 0 0; display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; font-size: 14px; }
  .rec dt { color: var(--gold); font-size: 12px; letter-spacing: 1px; padding-top: 2px; }
  .rec dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .rec .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .idea { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .idea:last-child { border-bottom: none; padding-bottom: 2px; }
  .idea .btn { flex: none; white-space: nowrap; }
  .idea b { font-weight: 600; display: block; }
  .idea .muted { margin-top: 2px; }
  .q-li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: center; }
  .q-li:last-child { border-bottom: none; }
  .bar-row { margin: 12px 0 0; font-size: 14px; }
  .bar-row .lab { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .bar { height: 8px; background: var(--gold-soft); border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-2)); border-radius: 4px; transition: width .4s; }
  .fld-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .fld-h b { font-size: 16px; }

  /* ================= 시간표 / 내신 / 타이머 ================= */
  .ttwrap { overflow-x: auto; padding: 16px 18px 20px; }
  table.tt { width: 100%; border-collapse: separate; border-spacing: 6px; min-width: 560px; }
  table.tt th { font-size: 13px; font-weight: 600; padding: 10px 4px; color: var(--muted); letter-spacing: 1px; }
  table.tt th.today { color: var(--navy); background: var(--gold-soft); border-radius: 10px; }
  table.tt td.p { text-align: center; font-family: var(--serif); font-size: 14px; color: var(--gold); width: 54px; }
  table.tt td.p.bring-l { font-family: var(--sans); font-size: 12px; color: var(--muted); }
  table.tt input { text-align: center; padding: 11px 4px; font-size: 14px; }
  table.tt input.today { background: #fbf6ea; border-color: #e7d6ae; }
  .two-g { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
  .g-row { display: grid; grid-template-columns: 1fr 86px 100px 34px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .g-head { font-size: 11.5px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px; }
  .modebar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .modebar select { width: auto; }

const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function pad(n) { return String(n).padStart(2, "0"); }
function dateKey(d = new Date()) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function daysLeft(str) {
  const [y, m, d] = str.split("-").map(Number);
  const t = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((t - today) / 86400000);
}
function ddayText(n) { return n === 0 ? "D-Day" : n > 0 ? "D-" + n : "D+" + (-n); }
function ddayClass(n) { return n <= 2 ? "red" : n <= 7 ? "amber" : ""; }
function fmtHM(sec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return h > 0 ? h + "시간 " + m + "분" : m + "분"; }
function fmtShort(sec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return h > 0 ? h + "h " + pad(m) + "m" : m + "m"; }
function sumValues(o) { return Object.values(o).reduce((a, b) => a + b, 0); }
function trunc(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

// 2. 계정 (이 기기·브라우저에 저장되는 계정)
// =====================================================
const ACC_KEY = "slh-accounts-v2";
const dataKey = (id) => "slh-data-v2:" + id;
let ACC = lsGet(ACC_KEY, { users: {}, current: null });
if (!ACC.users) ACC = { users: {}, current: null };
function saveAcc() { lsSet(ACC_KEY, ACC); }
const accId = (name) => name.trim().toLowerCase();

const toHex = (buf) => Array.from(new Uint8Array(buf)).map(b => pad(b.toString(16))).join("");
const fromHex = (h) => new Uint8Array(h.match(/.{2}/g).map(x => parseInt(x, 16)));
async function hashPw(pw, saltHex) {
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: fromHex(saltHex), iterations: 120000, hash: "SHA-256" }, key, 256);
    return toHex(bits);
  }
  let h = 5381; const s = pw + saltHex;               // 구형 브라우저용 단순 대체 (보안 약함)
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return "weak:" + h;
}
function newSalt() { return toHex(crypto.getRandomValues(new Uint8Array(16))); }

let CUR = null;   // 현재 로그인한 계정 id
let S = null;     // 현재 계정의 데이터

function defaultState() {
  return {
    tasks: [],
    tt: { cells: Array.from({ length: 5 }, () => new Array(7).fill("")), bring: new Array(5).fill("") },
    grades: { mode: 5, rows: [] },
    study: {},
    pref: { timerMode: "25/5", subject: "" },
    records: [],
    ideas: [],
  };
}
function normalizeTask(t) {
  return {
    id: String(t.id ?? uid()), subject: t.subject || "", title: t.title || "", date: t.date || dateKey(), points: t.points || "", done: !!t.done,
    guide: { text: "", fileName: "", ...(t.guide || {}) },
    guideInfo: t.guideInfo || { dates: [], points: [] },
    criteria: Array.isArray(t.criteria) ? t.criteria : [],
    work: { text: "", fileName: "", manual: {}, checked: false, ...(t.work || {}) },
  };
}
function normalizeState(saved) {
  const d = defaultState();
  const s = { ...d, ...(saved || {}) };
  s.tt = { ...d.tt, ...(s.tt || {}) };
  s.grades = { ...d.grades, ...(s.grades || {}) };
  s.pref = { ...d.pref, ...(s.pref || {}) };
  s.tasks = (s.tasks || []).map(normalizeTask);
  s.records = Array.isArray(s.records) ? s.records : [];
  s.ideas = Array.isArray(s.ideas) ? s.ideas : [];
  return s;
}
function save() { if (CUR && S && !lsSet(dataKey(CUR), S)) toast("저장 공간이 부족해요. 설정에서 백업 후 정리해 주세요."); }

async function signup(name, pw, pw2) {
  name = name.trim();
  if (name.length < 2 || name.length > 20) return "이름은 2~20자로 입력해 주세요.";
  if (pw.length < 4) return "비밀번호는 4자 이상으로 입력해 주세요.";
  if (pw !== pw2) return "비밀번호 확인이 일치하지 않아요.";
  const id = accId(name);
  if (ACC.users[id]) return "이미 있는 이름이에요. 로그인해 주세요.";
  const salt = newSalt();
  ACC.users[id] = { name, salt, hash: await hashPw(pw, salt), created: dateKey() };
  const first = Object.keys(ACC.users).length === 1;
  let st = defaultState();
  const old = lsGet("school-hub-v1", null);            // 이전 버전 데이터가 있으면 첫 계정으로 가져오기
  if (first && old && typeof old === "object") { st = normalizeState({ ...old }); st.records = []; st.ideas = []; setTimeout(() => toast("이전 버전에 저장했던 데이터를 가져왔어요."), 600); }
  lsSet(dataKey(id), st);
  ACC.current = id; saveAcc();
  startSession(id);
  return "";
}
async function login(name, pw) {
  const id = accId(name);
  const u = ACC.users[id];
  if (!u) return "없는 계정이에요. 회원가입을 먼저 해 주세요.";
  if ((await hashPw(pw, u.salt)) !== u.hash) return "비밀번호가 맞지 않아요.";
  ACC.current = id; saveAcc();
  startSession(id);
  return "";
}
function logout() {
  flushStudy(); resetTimer(); save();
  CUR = null; S = null; ACC.current = null; saveAcc();
  location.hash = "";
  showAuth("login");
}
function startSession(id) {
  CUR = id;
  S = normalizeState(lsGet(dataKey(id), null));
  $("#auth").classList.add("hidden");
  $("#app").classList.remove("hidden");
  const name = ACC.users[id].name;
  $("#userbox").innerHTML = `<div class="avatar">${esc(name.slice(0, 1).toUpperCase())}</div><div style="min-width:0"><div class="nm">${esc(name)}</div><button class="lo" data-act="logout">로그아웃</button></div>`;
  resetTimer();
  if (!location.hash || location.hash === "#") location.hash = "#/home";
  renderRoute();
}

    if (RE_FORBID.test(line)) {
      if (quotes.length) push({ type: "forbidden", words: quotes, src: line });
      else if (!lens.length) push({ type: "manual", cat: "주의·감점", label, src: line });
    } else if (RE_FORMAT.test(line)) {
      if (!lens.length || /글꼴|pt|여백|줄\s*간격/i.test(line)) push({ type: "manual", cat: "형식·제출", label, src: line });
    } else if (RE_EVAL.test(line)) {
      push({ type: "manual", cat: "평가 기준", label, src: line });
    } else if (RE_REQ.test(line)) {
      if (quotes.length) push({ type: "keyword", words: quotes, mode: "all", src: line });
      if (!lens.length) push({ type: "manual", cat: "포함 내용", label, src: line });
    }
  }
  return { criteria: out.slice(0, 40), info };
}

function textStats(text) {
  const t = String(text || "").replace(/\r/g, "");
  const char = Array.from(t.replace(/\n/g, "")).length;
  const charNoSpace = Array.from(t.replace(/\s/g, "")).length;
  const word = (t.trim().match(/\S+/g) || []).length;
  let paras = t.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  if (paras.length <= 1) { const lines = t.split("\n").map(s => s.trim()).filter(Boolean); if (lines.length > 1) paras = lines; }
  const para = t.trim() ? paras.length : 0;
  const sentence = t.replace(/([.!?。])\s+/g, "$1\n").split("\n").map(s => s.trim()).filter(s => s.length > 1).length;
  return { char, charNoSpace, word, para, sentence };
}
const finite = (v) => v !== null && v !== "" && v !== undefined && Number.isFinite(Number(v));
function critRuleText(c) {
  const mn = finite(c.min) ? Number(c.min) : null, mx = finite(c.max) ? Number(c.max) : null;
  if (mn !== null && mx !== null) return `${mn.toLocaleString()} ~ ${mx.toLocaleString()}`;
  if (mn !== null) return `${mn.toLocaleString()} 이상`;
  if (mx !== null) return `${mx.toLocaleString()} 이하`;
  return "기준 미입력";
}
function wordsOf(c) { return (c.words || []).map(w => String(w).trim()).filter(Boolean); }
function evaluate(task) {
  const text = task.work.text, st = textStats(text), low = text.toLowerCase();
  return task.criteria.map(c => {
    if (c.type === "length") {
      const v = st[c.unit]; const mn = finite(c.min) ? Number(c.min) : null, mx = finite(c.max) ? Number(c.max) : null;
      if (mn === null && mx === null) return { c, status: "todo", msg: "기준 숫자를 입력해 주세요." };
      const ok = (mn === null || v >= mn) && (mx === null || v <= mx);
      let msg = `현재 ${v.toLocaleString()} · 기준 ${critRuleText(c)}${c.partial ? " · 글 전체로 계산(일부 영역 기준일 수 있어요)" : ""}`;
      if (!ok) msg += v < (mn ?? 0) ? ` (${(mn - v).toLocaleString()} 부족)` : ` (${(v - mx).toLocaleString()} 초과)`;
      return { c, status: ok ? "ok" : "bad", msg };
    }
    if (c.type === "keyword") {
      const ws = wordsOf(c); if (!ws.length) return { c, status: "todo", msg: "포함할 단어를 입력해 주세요." };
      const found = ws.filter(w => low.includes(w.toLowerCase())), miss = ws.filter(w => !found.includes(w));
      const ok = c.mode === "any" ? found.length > 0 : miss.length === 0;
      return { c, status: ok ? "ok" : "bad", msg: ok ? `찾음: ${found.join(", ")}` : `못 찾음: ${(c.mode === "any" ? ws : miss).join(", ")}` };
    }
    if (c.type === "forbidden") {
      const ws = wordsOf(c); if (!ws.length) return { c, status: "todo", msg: "금지할 단어를 입력해 주세요." };
      const hit = ws.filter(w => low.includes(w.toLowerCase()));
      return { c, status: hit.length ? "bad" : "ok", msg: hit.length ? `들어 있음: ${hit.join(", ")}` : "금지 단어가 없어요" };
    }
    return { c, status: task.work.manual[c.id] ? "ok" : "todo", manual: true };
  });
}
function critLabel(c) {
  if (c.type === "length") return `${UNIT_LABEL[c.unit] || "분량"}: ${critRuleText(c)}`;
  if (c.type === "keyword") return `${c.mode === "any" ? "다음 중 하나 이상" : "다음 단어 모두"} 포함: ${wordsOf(c).join(", ") || "(미입력)"}`;
  if (c.type === "forbidden") return `금지 단어: ${wordsOf(c).join(", ") || "(미입력)"}`;
  return c.label || "직접 확인";
}

}

  const now = Date.now(), dt = Math.min((now - T.last) / 1000, 2); T.last = now;
  const m = MODES[S.pref.timerMode];
  if (!m) { T.remaining += dt; addStudy(dt); }
  else { if (T.phase === "focus") addStudy(dt); T.remaining -= dt; if (T.remaining <= 0) { beep(); T.phase = T.phase === "focus" ? "break" : "focus"; T.remaining = (T.phase === "focus" ? m[0] : m[1]) * 60; } }
  updateTimerUI();
}, 250);
function fmtClock(sec) { sec = Math.max(0, MODES[S.pref.timerMode] ? Math.ceil(sec) : Math.floor(sec)); return pad(Math.floor(sec / 60)) + ":" + pad(sec % 60); }
function updateTimerUI() {
  const text = fmtClock(T.remaining);
  if (T.running) document.title = text + " · School Life Hub";
  const clock = $("#clock"); if (!clock) return;
  clock.textContent = text;
  const m = MODES[S.pref.timerMode];
  $("#phase").textContent = !m ? "STOPWATCH" : T.phase === "focus" ? "FOCUS" : "BREAK";
  $("#startBtn").textContent = T.running ? "일시정지" : "시작";
  const fill = m ? Math.max(0, Math.min(1, T.remaining / phaseTotal())) : (T.remaining % 3600) / 3600;
  $("#ring").style.strokeDashoffset = RING * (1 - fill);
  $("#logBox").innerHTML = studyLogHtml();
}
function studyLogHtml() {
  const ts = todayStudy(), entries = Object.entries(ts).sort((a, b) => b[1] - a[1]), total = sumValues(ts);
  if (!entries.length) return `<div class="empty">아직 기록이 없어요.<br>시작 버튼을 눌러 보세요!</div>`;
  const max = entries[0][1];
  return `<div class="total"><span class="muted">총 공부 시간</span><b>${fmtHM(total)}</b></div>` + entries.map(([name, sec]) => `<div class="bar-row"><div class="lab"><span>${esc(name)}</span><span class="muted">${fmtHM(sec)}</span></div><div class="bar"><div style="width:${(sec / max) * 100}%"></div></div></div>`).join("");
}
function renderTimer() {
  view.innerHTML = `<h1 class="page-title">공부 타이머</h1><p class="page-lead">집중한 시간만 과목별로 기록돼요. 다른 탭으로 옮겨도 타이머는 계속 돌아가요.</p>
    <div class="two-t"><div><div class="timer-card"><div class="ring-wrap"><svg viewBox="0 0 240 240"><circle class="ring-bg" cx="120" cy="120" r="104"/><circle class="ring-fg" id="ring" cx="120" cy="120" r="104" stroke-dasharray="${RING}" stroke-dashoffset="0"/></svg>
      <div class="ring-in"><div class="phase" id="phase">FOCUS</div><div class="time" id="clock">25:00</div><div class="t-subj">${esc(S.pref.subject || "과목을 선택하세요")}</div></div></div>
      <div class="t-btns"><button class="btn gold" id="startBtn" data-act="tstart">시작</button><button class="btn ghost" data-act="treset">초기화</button></div></div>
      <div class="t-set"><select id="t-mode"><option value="25/5" ${S.pref.timerMode === "25/5" ? "selected" : ""}>25분 + 5분 휴식</option><option value="50/10" ${S.pref.timerMode === "50/10" ? "selected" : ""}>50분 + 10분 휴식</option><option value="stopwatch" ${S.pref.timerMode === "stopwatch" ? "selected" : ""}>스톱워치</option></select>
      <input id="t-subject" list="subj-list2" placeholder="과목 선택/입력" value="${esc(S.pref.subject)}"><datalist id="subj-list2">${allSubjects().map(s => `<option>${esc(s)}</option>`).join("")}</datalist></div></div>
      <div class="card"><div class="card-head"><h3>Today's Log</h3></div><div id="logBox"></div></div></div>`;
  updateTimerUI();
}

// =====================================================
// 12. 설정 / 더보기
// =====================================================
function renderMore() {
  view.innerHTML = `<h1 class="page-title">더보기</h1><p class="page-lead">다른 기능도 만나 보세요.</p>
    <div class="more-grid">${[["tt", "시간표"], ["grade", "내신 계산기"], ["timer", "공부 타이머"], ["settings", "설정 · 백업"]].map(([id, n]) => `<button data-go="${id}"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${n}</button>`).join("")}</div>
    <div class="row-btns" style="margin-top:20px"><button class="btn ghost" data-act="logout">로그아웃</button></div>`;
}
function renderSettings() {
  const u = ACC.users[CUR];
  const size = Math.round((JSON.stringify(S).length / 1024) * 10) / 10;
  view.innerHTML = `<h1 class="page-title">설정 · 백업</h1><p class="page-lead">계정과 데이터를 관리해요.</p>
    <div class="card"><div class="card-head"><h3>계정</h3></div>
      <div class="set-row"><div><b>${esc(u.name)}</b><span class="muted">가입일 ${esc(u.created)} · 저장 용량 약 ${size}KB</span></div><button class="btn ghost sm" data-act="logout">로그아웃</button></div>
      <div class="set-row"><div><b>비밀번호 변경</b><span class="muted">현재 비밀번호와 새 비밀번호를 입력하세요.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="pw-old" type="password" placeholder="현재" style="width:130px"><input id="pw-new" type="password" placeholder="새 비밀번호" style="width:150px"><button class="btn ghost sm" data-act="chpw">변경</button></div></div></div>
    <div class="card"><div class="card-head"><h3>백업 · 다른 기기로 옮기기</h3></div>
      <p class="muted" style="margin:0 0 8px">이 계정의 모든 데이터(수행평가, 기준, 활동 기록, 시간표 등)를 파일로 저장하거나 불러와요. 다른 기기·브라우저에서 쓰려면 파일을 옮긴 뒤 같은 이름으로 계정을 만들고 불러오세요.</p>
      <div class="row-btns"><button class="btn gold" data-act="export">백업 파일 내려받기</button><button class="btn ghost" data-act="importPick">백업 파일 불러오기</button><input type="file" id="importFile" class="hidden" accept=".json,application/json"></div></div>
    <div class="card"><div class="card-head"><h3>위험 구역</h3></div>
      <div class="set-row"><div><b>계정 삭제</b><span class="muted">이 기기에 저장된 이 계정의 데이터가 모두 지워져요.</span></div><button class="btn danger sm" data-act="delacc">계정 삭제</button></div></div>
    <div class="note">저장 방식: 데이터는 이 브라우저의 저장 공간(localStorage)에 보관돼요. 비밀번호는 암호화(해시)해 저장하지만, 데이터 자체는 암호화되지 않아요. 공용 컴퓨터에서는 쓰고 나서 꼭 로그아웃하세요. 브라우저의 사이트 데이터를 지우면 데이터도 사라지니 주기적으로 백업하세요.</div>`;
}
function downloadJSON(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// =====================================================
// 13. 이벤트 처리 (한 곳에서 모아서 처리)
// =====================================================
async function loadFileInto(kind, file, id) {
  const t = findTask(id); if (!t || !file) return;
  try {
    toast("파일을 읽는 중…");
    const text = await readAnyFile(file);
    if (!text.trim()) { toast("파일에서 글자를 찾지 못했어요."); return; }
    if (kind === "guide") { t.guide.text = text; t.guide.fileName = file.name; } else { t.work.text = text; t.work.fileName = file.name; t.work.checked = false; }
    save(); renderTaskDetail(id); toast(`'${trunc(file.name, 24)}'을(를) 불러왔어요.`);
  } catch (e) { toast(fileErrorMsg(e)); }
}

view.addEventListener("click", async (e) => {
  const goEl = e.target.closest("[data-go]");
  if (goEl) { nav(goEl.dataset.go); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;

  switch (act) {
    // --- 수행평가 목록 ---
    case "addTask": {
      const subject = $("#f-subject").value.trim(), title = $("#f-title").value.trim(), date = $("#f-date").value, points = $("#f-points").value;
      if (!title || !date) { toast("내용과 마감일은 꼭 입력해 주세요."); return; }
      S.tasks.push(normalizeTask({ id: uid(), subject, title, date, points, done: false })); save(); renderTasks(); break;
    }
    case "del": if (confirm("이 수행평가를 삭제할까요? (안내문·점검 내용도 함께 삭제돼요)")) { S.tasks = S.tasks.filter(t => String(t.id) !== String(id)); save(); renderTasks(); } break;
    case "tfilter": taskFilter = b.dataset.k; renderTasks(); break;
    case "open": nav("tasks/" + id); break;
    // --- 수행평가 상세 ---
    case "dtoggle": { const t = findTask(id); t.done = !t.done; save(); renderTaskDetail(id); break; }
    case "pick": $(b.dataset.kind === "guide" ? "#fileGuide" : "#fileWork").click(); break;
    case "extract": {
      const t = findTask(routeArg);
      if (t.guide.text.trim().length < 10) { toast("안내문 내용을 먼저 붙여넣거나 파일로 올려 주세요."); return; }
      if (t.criteria.length && !confirm("현재 기준을 지우고 새로 추출할까요?")) return;
      const { criteria, info } = extractCriteria(t.guide.text);
      t.criteria = criteria; t.guideInfo = info; t.work.checked = false; save(); renderTaskDetail(routeArg);
      toast(criteria.length ? `기준 ${criteria.length}개를 뽑았어요. 확인하고 고쳐 주세요.` : "뽑을 만한 기준을 찾지 못했어요. 직접 추가해 주세요.");
      break;
    }
    case "gclear": { const t = findTask(routeArg); t.guide = { text: "", fileName: "" }; t.guideInfo = { dates: [], points: [] }; save(); renderTaskDetail(routeArg); break; }
    case "cadd": {
      const t = findTask(routeArg), type = $("#newCrit").value;
      const c = { id: uid(), type };
      if (type === "length") Object.assign(c, { unit: "char", min: 500, max: "" }); else if (type === "manual") Object.assign(c, { cat: "직접 확인", label: "" }); else Object.assign(c, { words: [], mode: "all" });
      t.criteria.push(c); save(); renderTaskDetail(routeArg); break;
    }
    case "cdel": { const t = findTask(routeArg); t.criteria = t.criteria.filter(c => c.id !== b.dataset.cid); save(); renderTaskDetail(routeArg); break; }
    case "check": {
      const t = findTask(routeArg);
      if (!t.work.text.trim()) { toast("점검할 완성본을 먼저 붙여넣거나 올려 주세요."); return; }
      t.work.checked = true; save(); renderTaskDetail(routeArg); $("#resBox").scrollIntoView({ behavior: "smooth", block: "start" }); break;
    }
    case "wclear": { const t = findTask(routeArg); t.work = { text: "", fileName: "", manual: {}, checked: false }; save(); renderTaskDetail(routeArg); break; }
    case "toRecord": {
      const t = findTask(id);
      window.__recPrefill = { subject: t.subject, title: t.title, date: t.date, points: t.points, tags: [] };
      recEditing = "new"; nav("records"); break;
    }
    // --- 활동 기록 ---
    case "recNew": window.__recPrefill = {}; recEditing = "new"; renderRecords(); break;
    case "recEdit": recEditing = id; renderRecords(); window.scrollTo(0, 0); break;
    case "recCancel": recEditing = null; window.__recPrefill = {}; renderRecords(); break;
    case "recSave": {
      const f = readRecordForm();
      if (!f.title) { toast("수행평가 이름(또는 주제)을 입력해 주세요."); return; }
      if (recEditing === "new") S.records.push({ id: uid(), ...f }); else { const r = S.records.find(x => x.id === recEditing); Object.assign(r, f); }
      save(); recEditing = null; window.__recPrefill = {}; renderRecords(); toast("활동 기록을 저장했어요."); break;
    }
    case "recDel": if (confirm("이 활동 기록을 삭제할까요?")) { S.records = S.records.filter(r => r.id !== id); save(); renderRecords(); } break;
    case "recFilter": recFilter = b.dataset.k; renderRecords(); break;
    case "recIdeas": nav("ideas/" + id); break;
    // --- 심화탐구 ---
    case "shift": ideaShift++; renderIdeas(); break;
    case "ideaSave": S.ideas.push({ id: uid(), title: b.dataset.t, desc: b.dataset.d, subjects: b.dataset.s, status: "todo" }); save(); renderIdeas(); toast("보관함에 담았어요."); break;
    case "ideaDel": S.ideas = S.ideas.filter(i => i.id !== id); save(); renderIdeas(); break;
    // --- 내신 ---
    case "gadd": S.grades.rows.push({ name: "", unit: "", grade: 1 }); save(); renderGrade(); break;
    case "gdel": S.grades.rows.splice(Number(b.dataset.i), 1); save(); renderGrade(); break;
    case "gclearAll": if (confirm("입력한 과목을 모두 지울까요?")) { S.grades.rows = []; save(); renderGrade(); } break;
    // --- 타이머 ---
    case "tstart": if (!T.running) { T.running = true; T.last = Date.now(); try { if (!T.ctx) T.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else { T.running = false; flushStudy(); document.title = "School Life Hub"; } updateTimerUI(); break;
    case "treset": resetTimer(); updateTimerUI(); break;
    // --- 설정 ---
    case "logout": logout(); break;
    case "export": downloadJSON({ app: "school-life-hub", version: 2, user: ACC.users[CUR].name, exported: new Date().toISOString(), data: S }, `school-hub-${ACC.users[CUR].name}-${dateKey()}.json`); toast("백업 파일을 내려받았어요."); break;
    case "importPick": $("#importFile").click(); break;
    case "chpw": {
      const o = $("#pw-old").value, n = $("#pw-new").value, u = ACC.users[CUR];
      if (n.length < 4) { toast("새 비밀번호는 4자 이상이어야 해요."); return; }
      if ((await hashPw(o, u.salt)) !== u.hash) { toast("현재 비밀번호가 맞지 않아요."); return; }
      u.salt = newSalt(); u.hash = await hashPw(n, u.salt); saveAcc(); $("#pw-old").value = ""; $("#pw-new").value = ""; toast("비밀번호를 바꿨어요."); break;
    }
    case "delacc": {
      const u = ACC.users[CUR]; const pw = prompt("계정을 삭제하려면 비밀번호를 입력하세요.");
      if (pw === null) return;
      if ((await hashPw(pw, u.salt)) !== u.hash) { toast("비밀번호가 맞지 않아요."); return; }
      if (!confirm("정말 삭제할까요? 되돌릴 수 없어요.")) return;
      const id2 = CUR; flushStudy(); resetTimer(); S = null; CUR = null; delete ACC.users[id2]; ACC.current = null; saveAcc();
      try { localStorage.removeItem(dataKey(id2)); } catch (e) {}
      location.hash = ""; showAuth(); break;
    }
  }
});

view.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.act === "toggle") { const task = findTask(t.dataset.id); if (task) task.done = t.checked; save(); renderTasks(); }
  else if (t.id === "fileGuide" || t.id === "fileWork") { const f = t.files[0]; t.value = ""; await loadFileInto(t.id === "fileGuide" ? "guide" : "work", f, routeArg); }
  else if (t.id === "importFile") {
    const f = t.files[0]; t.value = ""; if (!f) return;
    try {
      const obj = JSON.parse(await f.text()); const data = obj && obj.data ? obj.data : obj;
      if (!data || !Array.isArray(data.tasks)) throw new Error("bad");
      if (!confirm("현재 계정의 데이터를 백업 파일의 내용으로 바꿀까요? (현재 데이터는 사라져요)")) return;
      S = normalizeState(data); save(); toast("백업을 불러왔어요."); renderSettings();
    } catch (err) { toast("올바른 백업 파일이 아니에요."); }
  }
  else if (t.id === "g-mode") { S.grades.mode = Number(t.value); S.grades.rows.forEach(r => { if (Number(r.grade) > S.grades.mode) r.grade = S.grades.mode; }); save(); renderGrade(); }
  else if (t.id === "t-mode") { S.pref.timerMode = t.value; save(); resetTimer(); updateTimerUI(); }
  else if (t.id === "r-import") {
    const task = findTask(t.value); if (!task) return;
    $("#r-subject").value = task.subject; $("#r-title").value = task.title; $("#r-date").value = task.date; $("#r-points").value = task.points;
  }
  else if (t.dataset.idea) { const i = S.ideas.find(x => x.id === t.dataset.idea); if (i) { i.status = t.value; save(); } }
  else if (t.dataset.g) { const [i, key] = t.dataset.g.split(","); S.grades.rows[Number(i)][key] = t.value; save(); updateGradeResult(); }
  else if (t.dataset.c) { applyCrit(t); }
  else if (t.dataset.m !== undefined) { const task = findTask(routeArg); task.work.manual[t.dataset.m] = t.checked; save(); updateResults(); }
});
function applyCrit(el) {
  const [cid, field] = el.dataset.c.split(":"); const task = findTask(routeArg); if (!task) return;
  const c = task.criteria.find(x => x.id === cid); if (!c) return;
  if (field === "words") c.words = el.value.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
  else if (field === "min" || field === "max") c[field] = el.value === "" ? "" : Number(el.value);
  else c[field] = el.value;
  save(); updateResults();
}
view.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "guideText") { const task = findTask(routeArg); task.guide.text = t.value; save(); }
  else if (t.id === "workText") { const task = findTask(routeArg); task.work.text = t.value; if (task.work.checked) updateResults(); save(); }
  else if (t.dataset.tt) { const [d, p] = t.dataset.tt.split(",").map(Number); S.tt.cells[d][p] = t.value; save(); }
  else if (t.dataset.bring !== undefined) { S.tt.bring[Number(t.dataset.bring)] = t.value; save(); }
  else if (t.dataset.g) { const [i, key] = t.dataset.g.split(","); S.grades.rows[Number(i)][key] = t.value; save(); updateGradeResult(); }
  else if (t.dataset.c) { applyCrit(t); }
  else if (t.id === "t-subject") { S.pref.subject = t.value; save(); const s = $(".t-subj"); if (s) s.textContent = t.value || "과목을 선택하세요"; }
});
// 파일 끌어다 놓기
view.addEventListener("dragover", (e) => { const d = e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.classList.add("over"); } });
view.addEventListener("dragleave", (e) => { const d = e.target.closest("[data-drop]"); if (d) d.classList.remove("over"); });
view.addEventListener("drop", async (e) => {
  const d = e.target.closest("[data-drop]"); if (!d) return;
  e.preventDefault(); d.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) await loadFileInto(d.dataset.drop, f, routeArg);
});
window.addEventListener("beforeunload", () => { flushStudy(); });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { if (!e.target.closest("[data-drop]")) e.preventDefault(); });

(function init() {
  if (ACC.current && ACC.users[ACC.current]) startSession(ACC.current);
  else showAuth();
})();
